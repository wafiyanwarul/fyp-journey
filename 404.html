<!DOCTYPE html>
<html lang="id" dir="ltr">

<head>
    <!-- ── Meta Essentials ── -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />

    <!-- ── Primary SEO ── -->
    <title>404 — Halaman Tidak Ditemukan | FYP Journey</title>
    <meta name="description" content="Halaman yang Anda cari tidak dapat ditemukan. Kembali ke halaman utama FYP Journey." />
    <meta name="robots" content="noindex, follow" />

    <!-- ── Favicons / App Icons ── -->
    <link rel="icon" href="/assets/favicons/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicons/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/assets/favicons/favicon-16x16.png" />
    <link rel="apple-touch-icon" href="/assets/favicons/apple-touch-icon.png" sizes="180x180" />
    <link rel="manifest" href="/assets/favicons/site.webmanifest" />
    <meta name="theme-color" content="#00296B" />

    <!-- ── Google Fonts ── -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
        href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,400&display=swap"
        rel="stylesheet" />

    <!-- ── Stylesheets ── -->
    <link rel="stylesheet" href="/assets/css/variables.css" />
    <link rel="stylesheet" href="/assets/css/reset.css" />
    <link rel="stylesheet" href="/assets/css/main.css" />
    <link rel="stylesheet" href="/assets/css/animations.css" />
    <!-- Component CSS -->
    <link rel="stylesheet" href="/assets/css/components/navbar.css" />
    <link rel="stylesheet" href="/assets/css/components/footer.css" />
    <link rel="stylesheet" href="/assets/css/components/404.css" />

    <!-- Flag 404 for component-loader -->
    <script>
        window.is404Page = true;
    </script>
</head>

<body>

    <div id="page-loader" role="status" aria-live="polite" aria-label="Memuat halaman">
        <div class="loader-logo">FYP <span>Journey</span></div>
    </div>

    <!-- Header (injected by component-loader.js) -->
    <header id="site-header" role="banner"></header>

    <main class="error-page">
        <div class="error-page__content">
            <h1 class="error-page__title">Kami tidak dapat menemukan halaman yang kamu cari.</h1>
            <a href="/" class="btn btn--primary error-page__btn-home">Kembali ke Beranda</a>
        </div>

        <div class="error-page__illustration" aria-hidden="true">
            <!-- Orange card (top left) -->
            <div class="error-card error-card--orange">
                <div class="error-card__dots">
                    <div class="error-card__dot"></div>
                    <div class="error-card__dot"></div>
                </div>
            </div>

            <!-- Cyan card (bottom left) -->
            <div class="error-card error-card--cyan">
                <svg class="error-card__icon" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M12 2.25L6 6.19 12 10.13l6-3.94-6-3.94zM6 14.07l6-3.94 6 3.94-6 3.94-6-3.94zM6 10.13L0 14.07l6 3.94 6-3.94-6-3.94zM18 10.13l-6 3.94 6 3.94 6-3.94-6-3.94zM12 17.96l-6-3.94v1.54l6 3.94 6-3.94v-1.54l-6 3.94z"/>
                </svg>
            </div>

            <!-- Lavender card -->
            <div class="error-card error-card--lavender">
                <svg class="error-card__svg-line" viewBox="0 0 100 120" fill="none" stroke="currentColor" stroke-width="3.5">
                    <path d="M20,95 C20,30 80,90 80,25" stroke-linecap="round"/>
                    <circle cx="20" cy="95" r="5" fill="#C084FC" stroke="currentColor" stroke-width="2.5" />
                    <circle cx="80" cy="25" r="5" fill="#C084FC" stroke="currentColor" stroke-width="2.5" />
                    <line x1="20" y1="95" x2="38" y2="95" stroke="currentColor" stroke-width="1.5" />
                    <line x1="80" y1="25" x2="62" y2="25" stroke="currentColor" stroke-width="1.5" />
                </svg>
            </div>

            <!-- Yellow card -->
            <div class="error-card error-card--yellow">
                <span class="error-card__quotes-left">“</span>
                <span class="error-card__quotes-right">”</span>
            </div>

            <!-- Red card -->
            <div class="error-card error-card--red">
                <span class="error-card__text">Aa</span>
            </div>

            <!-- Green card -->
            <div class="error-card error-card--green">
                <svg class="error-card__icon error-card__icon--lock" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                    <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                    <circle cx="12" cy="16" r="1.5" fill="currentColor"></circle>
                </svg>
            </div>

            <!-- Purple card -->
            <div class="error-card error-card--purple">
                <svg class="error-card__icon error-card__icon--photo" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="3" width="18" height="18" rx="3" ry="3"></rect>
                    <circle cx="8.5" cy="8.5" r="1.5" fill="currentColor"></circle>
                    <path d="M21 15l-5-5L5 21"></path>
                </svg>
            </div>

            <!-- Navy card -->
            <div class="error-card error-card--navy">
                <svg class="error-card__svg-line" viewBox="0 0 100 120" fill="none" stroke="currentColor" stroke-width="2.5">
                    <polyline points="20,30 80,60 20,90" stroke-linecap="round" stroke-linejoin="round"/>
                    <circle cx="20" cy="30" r="5" fill="#1E293B" stroke="currentColor" stroke-width="2.5" />
                    <circle cx="80" cy="60" r="5" fill="#1E293B" stroke="currentColor" stroke-width="2.5" />
                    <circle cx="20" cy="90" r="5" fill="#1E293B" stroke="currentColor" stroke-width="2.5" />
                </svg>
            </div>
        </div>
    </main>

    <!-- Footer (injected by component-loader.js) -->
    <footer id="site-footer" role="contentinfo"></footer>

    <!-- Scripts -->
    <script type="module" src="/assets/js/component-loader.js"></script>
    <script type="module" src="/assets/js/main.js" defer></script>

</body>

</html>
